<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Renderer (Advanced MathJax)</title>
    <!-- MathJax 3 核心配置 -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                // 自动加载高级宏包：物理、化学、约分、颜色、加粗
                packages: {'[+]': ['physics', 'mhchem', 'cancel', 'color', 'boldsymbol']},
                processEscapes: true
            },
            loader: {
                load: ['[tex]/physics', '[tex]/mhchem', '[tex]/cancel', '[tex]/color', '[tex]/boldsymbol']
            },
            startup: {
                typeset: false // 取消自动渲染，交由下方脚本接管实时渲染
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            height: 30vh;
            min-height: 50px;
            max-height: calc(100vh - 50px);
            padding: 20px;
            border: none;
            outline: none;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.5;
            color: #111111;
            background: #fafafa;
            resize: none;
            overflow-y: auto;
            user-select: text;
            transition: background 0.2s;
        }

        textarea:focus {
            background: #ffffff;
        }

        .divider {
            width: 100%;
            height: 6px;
            background: #e1e4e8;
            cursor: ns-resize;
            flex-shrink: 0;
            position: relative;
            transition: background 0.15s;
        }

        .divider:hover, .divider.active {
            background: #0969da;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 2px;
            background: #a0a0a0;
            border-radius: 2px;
        }

        .divider:hover::after, .divider.active::after {
            background: #ffffff;
        }

        .render-area {
            flex: 1;
            width: 100%;
            padding: 20px 40px;
            overflow: auto;
            background: #ffffff;
            font-size: 1.2em;
            user-select: text;
            white-space: pre-wrap; /* 支持纯文本换行与图文混排 */
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center; /* 默认居中对齐 */
        }
        
        mjx-container {
            outline: none; /* 去除点击公式时出现的焦点框 */
        }
    </style>
</head>
<body>

    <textarea id="latex-input" placeholder="输入 LaTeX 代码（支持图文混排、原生 align 环境、\require{mhchem} 等高级语法）..."></textarea>
    <div class="divider" id="divider"></div>
    <div class="render-area" id="render-area"></div>

    <script>
        const input = document.getElementById('latex-input');
        const divider = document.getElementById('divider');
        const renderArea = document.getElementById('render-area');

        let renderTimeout;
        let isRendering = false;
        let pendingRender = false;

        // 转义HTML，防止输入 < 符号时破坏DOM结构
        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;");
        }

        function triggerRender() {
            if (isRendering) {
                pendingRender = true;
                return;
            }

            let rawVal = input.value;
            let content = rawVal.trim();

            if (!content) {
                renderArea.innerHTML = '';
                return;
            }

            // 清理完整的 LaTeX 文档结构（导言区等）
            content = content.replace(/\\documentclass[\s\S]*?\\begin\{document\}/g, '')
                             .replace(/\\end\{document\}/g, '')
                             .replace(/```(latex|math)?/gi, '')
                             .trim();

            // 智能定界符检测
            // 如果用户输入中没有 $, \[, \( 或顶级的 display 环境，则判定为纯数学公式片段，自动包裹为 displayMath
            const hasMathDelimiters = /(\$|\\\[|\\\(|\\begin\{(align|equation|eqnarray|gather|multline|alignat|flalign|cd)\*?\})/.test(content);
            
            if (!hasMathDelimiters && content.length > 0) {
                content = '\\[' + content + '\\]';
            }

            renderArea.innerHTML = escapeHTML(content);

            if (window.MathJax && MathJax.typesetPromise) {
                isRendering = true;
                MathJax.typesetPromise([renderArea]).then(() => {
                    isRendering = false;
                    if (pendingRender) {
                        pendingRender = false;
                        triggerRender();
                    }
                }).catch((err) => {
                    isRendering = false;
                    renderArea.innerHTML = '<span style="color: red; font-size: 14px;">渲染错误: ' + err.message + '</span>';
                });
            }
        }

        // 防抖：避免高频按键导致 MathJax 堆积渲染卡顿
        input.addEventListener('input', () => {
            clearTimeout(renderTimeout);
            renderTimeout = setTimeout(triggerRender, 200);
        });

        // ================= 拖拽调整大小逻辑 =================
        let isDragging = false;

        function startDrag(e) {
            e.preventDefault(); // 防止在触屏设备上触发滚动
            isDragging = true;
            divider.classList.add('active');
            document.body.style.cursor = 'ns-resize';
        }

        function doDrag(e) {
            if (!isDragging) return;
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
            if (!clientY) return;
            // 限制输入框最小 50px，最大高度视窗减去 80px
            const newHeight = Math.max(50, Math.min(window.innerHeight - 80, clientY));
            input.style.height = `${newHeight}px`;
        }

        function stopDrag() {
            if (isDragging) {
                isDragging = false;
                divider.classList.remove('active');
                document.body.style.cursor = '';
            }
        }

        divider.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('mouseup', stopDrag);

        divider.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('touchmove', doDrag, { passive: false });
        document.addEventListener('touchend', stopDrag);
    </script>
</body>
</html>
