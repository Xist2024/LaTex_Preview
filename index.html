<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Renderer (Advanced MathJax - Optimized)</title>
    <!-- MathJax 3 核心配置 -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: {'[+]': ['physics', 'mhchem', 'cancel', 'color', 'boldsymbol']},
                processEscapes: true
            },
            loader: {
                load: ['[tex]/physics', '[tex]/mhchem', '[tex]/cancel', '[tex]/color', '[tex]/boldsymbol']
            },
            startup: {
                typeset: false 
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            height: 30vh;
            min-height: 50px;
            max-height: calc(100vh - 50px);
            padding: 20px;
            border: none;
            outline: none;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.5;
            color: #111111;
            background: #fafafa;
            resize: none;
            overflow-y: auto;
            user-select: text;
            transition: background 0.2s;
            will-change: height;
        }

        textarea:focus {
            background: #ffffff;
        }

        .divider {
            width: 100%;
            height: 6px;
            background: #e1e4e8;
            cursor: ns-resize;
            flex-shrink: 0;
            position: relative;
            transition: background 0.15s;
        }

        .divider:hover, .divider.active {
            background: #0969da;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 2px;
            background: #a0a0a0;
            border-radius: 2px;
        }

        .divider:hover::after, .divider.active::after {
            background: #ffffff;
        }

        .render-area {
            flex: 1;
            width: 100%;
            padding: 20px 15px; 
            overflow: auto;
            background: #ffffff;
            font-size: 1.1em;
            user-select: text;
            line-height: 1.8;
            display: block; /* 修复 Flex 居中导致的移动端溢出截断缺陷 */
        }

        /* LaTeX 导出的标题样式渲染控制 */
        .render-area h2 {
            font-size: 1.4em;
            font-weight: bold;
            margin: 15px 0 10px 0;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .render-area h3 {
            font-size: 1.2em;
            font-weight: bold;
            margin: 12px 0 8px 0;
        }
        
        mjx-container {
            outline: none; 
        }

        /* 针对块级数学公式开启独立容器的横向滚动 */
        mjx-container[display="true"] {
            overflow-x: auto;
            overflow-y: hidden;
            max-width: 100%;
            scrollbar-width: none; /* Firefox */
            margin: 10px 0 !important;
        }
        
        mjx-container[display="true"]::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
    </style>
</head>
<body>

    <textarea id="latex-input" placeholder="输入 LaTeX 代码（支持图文混排、原生 align 环境、\section 标题排版等）..."></textarea>
    <div class="divider" id="divider"></div>
    <div class="render-area" id="render-area"></div>

    <script>
        const input = document.getElementById('latex-input');
        const divider = document.getElementById('divider');
        const renderArea = document.getElementById('render-area');

        let renderTimeout;
        let pendingContent = null;
        let lastRenderedContent = null;
        
        // 使用 Promise 链构建严格的串行渲染队列
        let mjxPromise = Promise.resolve(); 

        // 安全 HTML 转义，防止直接注入 script
        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;");
        }

        function triggerRender() {
            let rawContent = input.value.trim();

            if (!rawContent) {
                renderArea.innerHTML = '';
                lastRenderedContent = '';
                return;
            }

            // 1. 清理导言区及 Markdown 代码块语法
            let content = rawContent.replace(/\\documentclass[\s\S]*?\\begin\{document\}/g, '')
                                    .replace(/\\end\{document\}/g, '')
                                    .replace(/```(latex|math)?/gi, '')
                                    .trim();

            // 2. 转义基础 HTML 字符
            content = escapeHTML(content);

            // 3. 预处理 LaTeX 文档级排版命令
            content = content
                .replace(/\\section\*?\{([^}]+)\}/g, '<h2>$1</h2>')
                .replace(/\\subsection\*?\{([^}]+)\}/g, '<h3>$1</h3>')
                .replace(/\n\s*\n/g, '<br><br>'); // 保留正常段落空行

            // 4. 智能定界符检测（适用于纯数学公式片段）
            const hasMathDelimiters = /(\$|\\\[|\\\(|\\begin\{(align|equation|eqnarray|gather|multline|alignat|flalign|cd)\*?\})/.test(content);
            const hasHTMLTags = /<h[23]>/.test(content);
            
            if (!hasMathDelimiters && !hasHTMLTags && content.length > 0) {
                content = '\\[' + content + '\\]';
            }

            // 5. 拦截重复渲染
            if (content === lastRenderedContent) return;

            pendingContent = content;

            mjxPromise = mjxPromise.then(() => {
                if (pendingContent === null) return;
                
                const currentContent = pendingContent;
                pendingContent = null;
                lastRenderedContent = currentContent;

                renderArea.innerHTML = currentContent;

                if (window.MathJax && MathJax.typesetPromise) {
                    // 强制清理 MathJax 渲染缓存，阻止内存泄漏
                    MathJax.typesetClear([renderArea]);
                    
                    return MathJax.typesetPromise([renderArea]).catch((err) => {
                        renderArea.innerHTML = `<span style="color: red; font-size: 14px;">渲染错误: ${err.message}</span>`;
                    });
                }
            });
        }

        // 防抖触发机制
        input.addEventListener('input', () => {
            clearTimeout(renderTimeout);
            renderTimeout = setTimeout(triggerRender, 120);
        });

        // ================= 拖拽调整大小逻辑 =================
        let isDragging = false;

        function startDrag(e) {
            e.preventDefault(); 
            isDragging = true;
            divider.classList.add('active');
            document.body.style.cursor = 'ns-resize';
        }

        function doDrag(e) {
            if (!isDragging) return;
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
            if (!clientY) return;
            const newHeight = Math.max(50, Math.min(window.innerHeight - 80, clientY));
            input.style.height = `${newHeight}px`;
        }

        function stopDrag() {
            if (isDragging) {
                isDragging = false;
                divider.classList.remove('active');
                document.body.style.cursor = '';
            }
        }

        divider.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('mouseup', stopDrag);

        divider.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('touchmove', doDrag, { passive: false });
        document.addEventListener('touchend', stopDrag);
    </script>
</body>
</html>
